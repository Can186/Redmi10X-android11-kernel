name: Resukisu
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt install tree
          sudo apt-get install -y --no-install-recommends \
            libelf-dev bison flex bc libssl-dev
          git clone --depth=1 https://github.com/picasso09/clang-11.0.1-r383902.git /opt/clang11
          ln -sfn /opt/clang11 /opt/clang12
          /opt/clang11/bin/clang --version
          wget -q -O arm64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm64 && tar -xf arm64.tar.gz -C /opt/gcc-arm64
          wget -q -O arm32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm32 && tar -xf arm32.tar.gz -C /opt/gcc-arm32

      - name: 拉取 MTK 驱动模块
        run: |
          mkdir -p vendor/mediatek
          git clone --depth=1 --branch cezanne-r-oss \
            https://github.com/MiCode/MTK_kernel_modules.git \
            vendor/mediatek/kernel_modules
          ls vendor/mediatek/kernel_modules/connectivity/
          tree vendor/mediatek/kernel_modules/
      

      - name: 手动创建 WLAN/BT/GPS 软链接
        run: |
          SRC_DIR="drivers/misc/mediatek/connectivity"
          VENDOR_DIR="vendor/mediatek/kernel_modules/connectivity"

          rm -rf "$SRC_DIR/wlan_drv_gen4m" "$SRC_DIR/bt" "$SRC_DIR/gps_drv"

          ln -snf "$(realpath $VENDOR_DIR/wlan/core/gen4m)" "$SRC_DIR/wlan_drv_gen4m"
          ln -snf "$(realpath $VENDOR_DIR/bt/mt66xx/legacy)" "$SRC_DIR/bt"
          ln -snf "$(realpath $VENDOR_DIR/gps)" "$SRC_DIR/gps_drv"

          echo "=== 修改后：创建好的软链接 ==="
          ls -la "$SRC_DIR/" | grep -E "wlan_drv_gen4m|bt|gps_drv"

      - name: 修改驱动 Makefile 的 TOP
        run: |
          for f in \
            vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/Makefile \
            vendor/mediatek/kernel_modules/connectivity/wlan/adaptor/Makefile \
            vendor/mediatek/kernel_modules/connectivity/bt/mt66xx/legacy/Makefile \
            vendor/mediatek/kernel_modules/connectivity/fmradio/Makefile \
            vendor/mediatek/kernel_modules/connectivity/gps/Makefile; do
            if [ -f "$f" ]; then
              sed -i 's|TOP[[:space:]]*:=[[:space:]]*\$(srctree)/\.\.|TOP := $(srctree)/|' "$f"
            fi
          done

      - name: 修改 GPS/BT 驱动为内建
        run: |
          sed -i 's/^obj-m += \$(MODULE_NAME)\.o/obj-y += $(MODULE_NAME).o/' vendor/mediatek/kernel_modules/connectivity/gps/Makefile
          sed -i 's/^obj-m += \$(MODULE_NAME)\.o/obj-y += $(MODULE_NAME).o/' vendor/mediatek/kernel_modules/connectivity/bt/mt66xx/legacy/Makefile
          sed -i 's/static void __exit gps_emi_mod_exit/static void gps_emi_mod_exit/' vendor/mediatek/kernel_modules/connectivity/gps/gps_emi.c
          sed -i 's/static void __exit gps_fw_log_exit/static void gps_fw_log_exit/' vendor/mediatek/kernel_modules/connectivity/gps/fw_log_gps.c

      - name: 修复 cmdq_handle 指针强转
        run: |
          F="drivers/gpu/drm/mediatek/mtk_drm_crtc.c"
          if [ -f "$F" ]; then
            echo "=== 原始 ==="
            grep -n "unsigned int)\*cmdq_handle" "$F"
            sed -i 's/(unsigned int)\*cmdq_handle/(unsigned long)*cmdq_handle/g' "$F"
            echo "=== 修改后 ==="
            grep -n "cmdq_handle" "$F" | head -5
          fi

      - name: 修复触摸屏固件缺失
        run: |
          mkdir -p drivers/input/touchscreen/focaltech_touch/include/firmware
          mkdir -p drivers/input/touchscreen/focaltech_touch/include/pramboot
          touch drivers/input/touchscreen/focaltech_touch/include/firmware/fw_ft3518_j7.i
          touch drivers/input/touchscreen/focaltech_touch/include/firmware/fw_sample.i
          touch drivers/input/touchscreen/focaltech_touch/include/pramboot/FT8719_Pramboot_V0.5_20171221.i
          echo "=== 验证 ==="
          ls -la drivers/input/touchscreen/focaltech_touch/include/firmware/
          ls -la drivers/input/touchscreen/focaltech_touch/include/pramboot/

      - name: 修复 scp_wdt_reset 未声明
        run: |
          F="drivers/misc/mediatek/scp/mt6873/scp_helper.h"
          if [ -f "$F" ]; then
            echo "=== SCP_RECOVERY_SUPPORT 上下文 ==="
            grep -n -B1 -A5 "SCP_RECOVERY_SUPPORT" "$F" | head -20
            if ! grep -q "void scp_wdt_reset" "$F"; then
              sed -i '/#if SCP_RECOVERY_SUPPORT/a void scp_wdt_reset(int cpu_id);' "$F"
            fi
            echo "=== 修改后 ==="
            grep -n -B1 -A8 "SCP_RECOVERY_SUPPORT" "$F" | head -25
          fi

      #- name: 添加 stpcpy 实现
        #run: |
          #if ! grep -q "char \*stpcpy" lib/string.c; then
            #printf '\n#ifndef __HAVE_ARCH_STPCPY\nchar *stpcpy(char *dest, const char *src)\n{\n\twhile ((*dest = *src) != '\''\\0'\'') {\n\t\tdest++;\n\t\tsrc++;\n\t}\n\treturn dest;\n}\nEXPORT_SYMBOL(stpcpy);\n#endif\n' >> lib/string.c
          #fi
          #grep -n "stpcpy" lib/string.c | head -5

      - name: 集成 ReSukiSU + SUSFS
        run: |
          echo "=== 1. ReSukiSU setup ==="
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          ls -la KernelSU/ | head -20

          echo "=== 2. SUSFS inline hook patches ==="
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh" | bash

          echo "=== 3. SUSFS 4.14 patch ==="
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Patch/susfs_patch_to_4.14.patch" -o /tmp/susfs_4.14.patch
          patch -p1 < /tmp/susfs_4.14.patch || echo "patch 失败（可能已应用或冲突）"
          echo "=== patch 结果 ==="
          ls -la fs/susfs.c 2>/dev/null || echo "fs/susfs.c 不存在"
          ls -la include/linux/susfs.h 2>/dev/null || echo "include/linux/susfs.h 不存在"
          ls -la include/linux/susfs_def.h 2>/dev/null || echo "include/linux/susfs_def.h 不存在"

      - name: 修复 task_mmu.c 缺 susfs_def.h
        run: |
          F="fs/proc/task_mmu.c"
          if [ -f "$F" ]; then
            echo "=== 1. 插入 susfs_def.h include ==="
            if ! grep -q "susfs_def.h" "$F"; then
              LAST_INC=$(grep -n '^#include' "$F" | tail -1 | cut -d: -f1)
              echo "  最后一个 #include 在第 $LAST_INC 行"
              sed -i "${LAST_INC}a #include <linux/susfs_def.h>" "$F"
            fi
            grep -n "susfs_def.h" "$F"

            echo "=== 2. 修复 smap_gather_stats 的 return 0 ==="
            sed -i '/static void smap_gather_stats/,/^}/{s/return 0;/return;/}' "$F"
            grep -n "smap_gather_stats" "$F" | head -5
            sed -n '/static void smap_gather_stats/,/^}/p' "$F" | head -30
          fi
      
      - name: 单独调试 connectivity/Makefile
        run: |
          export PATH="/opt/clang12/bin:/opt/gcc-arm64/bin:/opt/gcc-arm32/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-androidkernel-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "=== 手动执行 connectivity/Makefile ==="
          make -j$(nproc) -C drivers/misc/mediatek/connectivity M=$PWD/drivers/misc/mediatek/connectivity modules 2>&1 | head -50

          echo "=== 直接展开 abspath 看结果 ==="
          make -f drivers/misc/mediatek/connectivity/Makefile -p 2>&1 | grep -E "ABS_PATH_TO_WMT_DRV|PATH_TO_WMT_DRV" | head -10
      
      - name: 编译内核
        run: |
          export PATH="/opt/clang12/bin:/opt/gcc-arm64/bin:/opt/gcc-arm32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-androidkernel-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error"

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out atom_user_defconfig

          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --disable LTO_CLANG \
            --disable CONFIG_ANDROID_PARANOID_NETWORK \
            --enable CONFIG_SYSVIPC \
            --enable CONFIG_IPC_NS \
            --enable CONFIG_USER_NS \
            --enable CONFIG_DEVTMPFS \
            --enable CONFIG_WLAN_DRV_BUILD_IN \
            --enable CONFIG_MTK_COMBO_WIFI \
            --enable CONFIG_MTK_COMBO_BT \
            --enable CONFIG_MTK_COMBO_GPS \
            --enable CONFIG_KSU \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            --enable CONFIG_KSU_SUSFS_SUS_MAP \
            --set-str CONFIG_MTK_COMBO_CHIP CONSYS_6873

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out olddefconfig

          grep -E "CONFIG_(LTO_CLANG|CC_STACKPROTECTOR_STRONG|WLAN_DRV_BUILD_IN|MTK_COMBO_WIFI|MTK_COMBO_BT|MTK_COMBO_GPS|MTK_COMBO_CHIP)" out/.config || true

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out \
            CONFIG_WLAN_DRV_BUILD_IN=y 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

     

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Resukisu
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/mt6873.dtb
